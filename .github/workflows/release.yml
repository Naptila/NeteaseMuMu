name: Release signed APK

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore temporary signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          if [[ ! -s "$RUNNER_TEMP/release-keystore.jks" ]]; then
            echo "::error::The decoded signing keystore is empty"
            exit 1
          fi

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          if [[ -z "$version_name" ]]; then
            echo "::error::The tag must contain a version name"
            exit 1
          fi
          bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache "-PreleaseVersionName=$version_name" "-PreleaseVersionCode=$GITHUB_RUN_NUMBER"

      - name: Verify and prepare APK
        id: apk
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          safe_tag="${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/_}"
          apk_path="$RUNNER_TEMP/NeteaseMuMu-$safe_tag.apk"
          cp "$apk" "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" -- "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$GITHUB_REF_NAME" "$APK_PATH"
          else
            gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" -- "$GITHUB_REF_NAME" "$APK_PATH"
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"
